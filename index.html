<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#03140c" />
  <title>Dune's Daily Bullet Train</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- 열 때마다 최신 파일을 받아오도록 주소 뒤에 시각(?v=...)을 붙여요 -->
  <script>
    window.BUST = Date.now();
    document.write('<link rel="stylesheet" href="style.css?v=' + BUST + '" />');
  </script>
</head>
<body>
  <!-- 배경에 은은하게 떠다니는 빛 -->
  <div class="glow glow-blue"></div>
  <div class="glow glow-purple"></div>

  <main class="container">
    <header class="hero">
      <p class="eyebrow">DAILY BRIEFING</p>
      <h1>Dune's Daily <span class="gradient-text">Bullet Train</span></h1>
      <p class="date" id="date"></p>
      <p class="tagline">정치 · 부동산 · 경제, 오늘 꼭 볼 것만 <span id="count">9</span>가지</p>
    </header>

    <section class="cards" id="cards"></section>

    <!-- 오늘의 용어 사전 (script.js가 채워요) -->
    <section class="glossary" id="glossary"></section>

    <footer class="footer">
      순위는 조회수 · 이슈 · 여론관심도 세 점수의 평균이에요.<br />
      조회수는 네이버 · 네이트 많이 본 뉴스와 다음 실시간 트렌드를 참고해요.<br />
      75점 이상만 골라서, 날마다 개수가 달라질 수 있어요.<br />
      점수는 기사 내용을 바탕으로 한 추정 지수(0~100)예요.<br />
      자세한 내용은 각 카드의 원문 링크에서 확인하세요.
    </footer>
  </main>

  <!-- data.js를 먼저, 그다음 script.js를 항상 새로 받아와요 -->
  <script>
    function load(src, next) {
      const s = document.createElement("script");
      s.src = src + "?v=" + BUST;
      s.onload = next;
      document.body.appendChild(s);
    }
    load("data.js", () => load("script.js"));
  </script>
</body>
</html>
